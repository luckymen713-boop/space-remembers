],

let lang = "uk";
try { const s = localStorage.getItem("lang"); if (s === "uk" || s === "en") lang = s; } catch (e) {}
const openMore = new Set();

function modelUrl(id) { return location.origin + location.pathname + "?model=" + id; }
function renderMsgs(list) { return list.map(m => `<div class="msg ${m.type}">${m.text}</div>`).join(""); }

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = UI[lang][el.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang));
  document.getElementById("intro").innerHTML = UI[lang].intro.split("\n").map(t => `<p>${t}</p>`).join("");
  const box = document.getElementById("chapters");
  box.innerHTML = "";
  let prevGroup = null;
  CHAPTERS.forEach(c => {
    if (c.group !== prevGroup) {
      const h = document.createElement("h2");
      h.className = "group";
      h.textContent = G[c.group][lang];
      box.appendChild(h);
      prevGroup = c.group;
    }
    const isOpen = openMore.has(c.id);
    const a = document.createElement("article");
    const moreHtml = c.moreDialogue
      ? `<button class="btn-outline" data-more="${c.id}" aria-expanded="${isOpen}" aria-controls="more-${c.id}">${isOpen ? UI[lang].askLess : UI[lang].askMore}</button>
         <div class="more-box${isOpen ? " open" : ""}" id="more-${c.id}">${renderMsgs(c.moreDialogue[lang])}</div>`
      : "";
    a.innerHTML = `
      <p class="place">${c.place[lang]}</p>
      <h2>${c.name[lang]}</h2>
      <span class="badge">${c.status[lang]}</span>
      <div class="dialogue">${renderMsgs(c.dialogue[lang])}${moreHtml}</div>
      <div class="eng"><h3>${UI[lang].eng}</h3><p>${c.engText[lang]}</p></div>
      <div class="science"><h3>${UI[lang].science}</h3><ul>${c.facts[lang].map(f => `<li>${f}</li>`).join("")}</ul></div>
      <div class="row">
        <div class="qr" id="qr-${c.id}"></div>
        <div><button class="btn" data-open="${c.id}">${UI[lang].view3d}</button><p class="hint">${UI[lang].scan}</p></div>
      </div>
      <p class="src">${UI[lang].source}: <a href="${c.src}" target="_blank" rel="noopener">${c.src.replace("https://", "")}</a></p>`;
    box.appendChild(a);
    try { new QRCode(a.querySelector("#qr-" + c.id), { text: modelUrl(c.id), width: 110, height: 110 }); } catch (e) {}
  });
  box.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openModel(b.dataset.open));
  box.querySelectorAll("[data-more]").forEach(b => b.onclick = () => {
    const id = b.dataset.more;
    const more = document.getElementById("more-" + id);
    const nowOpen = more.classList.toggle("open");
    nowOpen ? openMore.add(id) : openMore.delete(id);
    b.setAttribute("aria-expanded", nowOpen);
    b.textContent = nowOpen ? UI[lang].askLess : UI[lang].askMore;
  });
}

const mv = document.getElementById("mv"), viewer = document.getElementById("viewer"), vmsg = document.getElementById("vmsg");
function openModel(id) {
  const c = CHAPTERS.find(x => x.id === id); if (!c) return;
  document.getElementById("vtitle").textContent = c.name[lang];
  vmsg.textContent = "";
  mv.src = "models/" + id + ".glb";
  viewer.classList.add("on");
}
mv.addEventListener("error", () => { vmsg.textContent = UI[lang].noModel; });
document.getElementById("vclose").onclick = () => { viewer.classList.remove("on"); history.replaceState(null, "", location.pathname); };
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  lang = b.dataset.l; try { localStorage.setItem("lang", lang); } catch (e) {}
  render();
});

render();
const m = new URLSearchParams(location.search).get("model");
if (m) openModel(m);
</script>
